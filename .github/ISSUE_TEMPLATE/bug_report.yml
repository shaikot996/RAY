name: Bug report
description: Report a reproducible problem in RAY
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Minimal Wolfram Language reproducer
      render: mathematica
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: input
    id: ray-version
    attributes:
      label: RAY version
      placeholder: "1.0.0"
  - type: input
    id: wolfram-version
    attributes:
      label: Mathematica / Wolfram Language version
