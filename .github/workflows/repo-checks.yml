name: Repository checks

on:
  push:
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f Kernel/RAY.wl
          test -f PacletInfo.wl
          test -f README.md
          test -f LICENSE
          test -f CITATION.cff
          test -f Tests/RAY_Tests.wl
          test -f Tests/RAY_Development_Tests.wl
          test -f Kernel/RAYRawExtensions.wl
          test -f Kernel/RAYMatter.wl
          test -f Kernel/RAYNumerics.wl
          test -f Kernel/RAYSymbolic.wl
          test -f DEVELOPMENT_API.md
          test -f Kernel/RAYAbstractAlgebra.wl
          test -f Tests/RAY_Benchmarks.wl
          test -f RAYStandalone.wl
          test -f RAY.wl
          test -f Kernel/RAYFormatting.wl
          test -f Kernel/RAYHandwritten.wl
          test -f Kernel/RAYSymbolicWarped.wl
          test -f Kernel/RAYCovariantWarped.wl
          test -f Kernel/RAYCrossWarped.wl
          test -f Kernel/RAYDownloads.wl
          test -f Tests/RAY_CrossWarped_Tests.wl
          test -f Tests/RAY_CrossWarp_Constant_Tests.wl
          test -f RELEASE_NOTES_v1.3.2.md
          test -f PAPER_STYLE_WARPED_GUIDE.md
          test -f Examples/RAY_AppendixC_CrossWarped.wl
          test -f RELEASE_NOTES_v1.3.2.md
          test -f Tests/RAY_CovariantWarped_Tests.wl
          test -f RELEASE_NOTES_v1.3.2.md
          test -f Tests/RAY_SymbolicWarped_Tests.wl
          test -f SYMBOLIC_DN_GUIDE.md
          test -f RELEASE_NOTES_v1.3.2.md
          test -f Tests/check_standalone_consistency.py
          test -f Tests/RAY_Handwritten_Tests.wl
          test -f Tests/RAY_Formatting_Tests.wl

      - name: Check package context and version
        run: |
          grep -q 'BeginPackage\["RAY`"\]' Kernel/RAY.wl
          grep -q '\$RAYVersion = "1.3.2"' Kernel/RAY.wl
          grep -q '"Version" -> "1.3.2"' PacletInfo.wl

      - name: Check source delimiters
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("Kernel/RAY.wl").read_text(encoding="utf-8")
          assert 'BeginPackage["RAY`"]' in s
          assert 'EndPackage[]' in s
          assert s.count('BeginPackage[') == s.count('EndPackage[') == 1
          print("Basic package structure checks passed.")
          PY

      - name: Static Wolfram Language source checks
        run: python Tests/check_wl_structure.py

      - name: Verify one-file distribution matches source modules
        run: python Tests/check_standalone_consistency.py
